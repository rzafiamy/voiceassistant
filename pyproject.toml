[project]
name = "voiceassistant"
version = "0.1.0"
description = "Real-time speech-to-text with IBM Granite Speech 4.1 2B"
requires-python = ">=3.10"
dependencies = [
    "torch==2.5.1+cu124",
    "torchaudio==2.5.1+cu124",
    "transformers>=4.52.1",
    "soundfile",
    "pyaudio",
    "numpy",
    "accelerate",
    "rich",
    "hf-transfer>=0.1.9",
]

[project.scripts]
voiceassistant = "voiceassistant.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voiceassistant"]

[dependency-groups]
dev = [
    "ipython",
]

[tool.uv.sources]
torch     = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url  = "https://download.pytorch.org/whl/cu124"
explicit = true
